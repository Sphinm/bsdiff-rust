name: Zig-Cross-Compile

env:
  DEBUG: 'napi:*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Zig
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'aarch64-apple-darwin'
          - 'x86_64-apple-darwin'
          - 'x86_64-unknown-linux-musl'
          - 'aarch64-unknown-linux-musl'
          - 'x86_64-unknown-linux-gnu'
          - 'aarch64-unknown-linux-gnu'
          - 'x86_64-pc-windows-msvc'
          - 'aarch64-pc-windows-msvc'

    steps:
      - run: docker run --rm --privileged multiarch/qemu-user-static:register --reset
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # ── Cargo registry / git cache (hash-based, auto-invalidates) ──
      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Install ziglang
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild and cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-xwin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── macOS SDK (cached) ──
      - name: Cache macOS SDK
        if: contains(matrix.target, 'apple')
        uses: actions/cache@v4
        with:
          path: /opt/MacOSX11.3.sdk
          key: macos-sdk-11.3

      - name: Install macOS SDK
        if: contains(matrix.target, 'apple')
        run: |
          if [ ! -d /opt/MacOSX11.3.sdk ]; then
            sudo mkdir -p /opt
            curl -L "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" | sudo tar -J -x -C /opt
          fi
          ls -la /opt/MacOSX11.3.sdk

      # ── Windows MSVC tools ──
      - name: Install Windows MSVC tools
        if: contains(matrix.target, 'windows')
        run: |
          sudo apt update
          sudo apt install -y lld llvm

      # ── Cross build ──
      # `--output-dir .` keeps the same layout as a local `pnpm build`: the
      # .node file, index.js and index.d.ts all land in the repo root.
      - name: Cross build native addon
        env:
          SDKROOT: /opt/MacOSX11.3.sdk
        run: |
          pnpm exec napi build --manifest-path bindings/node/Cargo.toml --target ${{ matrix.target }} --platform --release --cross-compile --output-dir .

      - name: List and verify generated files
        run: |
          echo "Built files for target: ${{ matrix.target }}"
          ls -la *.node || echo "No .node files found"
          ls -la index.* || echo "No index files found"
          echo "File details:"
          find . -name "*.node" -exec file {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.node
            index.js
            index.d.ts
          retention-days: 30

  test:
    name: Test ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 30
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Every entry runs the real test suite on a host whose architecture
          # matches the artifact. `container` marks targets whose libc differs
          # from the runner's (musl), which need an Alpine container to load.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: node:22-alpine
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: node:22-alpine
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.settings.target }}
          path: ./

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show downloaded binding
        shell: bash
        run: |
          echo "Target: ${{ matrix.settings.target }} on ${{ matrix.settings.host }}"
          ls -la *.node || echo "No .node files found"
          find . -maxdepth 1 -name "*.node" -exec file {} \;

      - name: Fetch test resources
        run: node scripts/fetch-test-resources.mjs

      # ── The actual test suite (test/index.ts) ──
      - name: Run tests
        if: matrix.settings.container == null
        run: pnpm test

      # musl artifacts cannot be loaded by a glibc Node.js, so the same suite
      # runs inside an Alpine container on the architecture-matched host.
      - name: Run tests (musl container)
        if: matrix.settings.container != null
        shell: bash
        run: |
          docker run --rm -v "$PWD:/build" -w /build \
            ${{ matrix.settings.container }} \
            node node_modules/mocha/bin/mocha.js --require ts-node/register test/index.ts

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - test
    if: ${{ needs.test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: create npm dirs
        run: pnpm exec napi create-npm-dirs

      - name: Move artifacts and create npm packages
        run: |
          echo "=== Moving artifacts ==="
          for dir in artifacts/*/; do
            echo "  -> copying from $dir"
            cp "$dir"*.node . 2>/dev/null || true
          done
          echo "=== Files in root ==="
          ls -la *.node || echo "No .node files"
          pnpm artifacts
          echo "=== npm dirs ==="
          ls -R ./npm

      - name: Verify npm authentication
        run: |
          echo "Verifying npm authentication..."
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          echo "Publishing main package..."
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
