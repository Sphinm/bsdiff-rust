name: Zig-Cross-Compile

env:
  DEBUG: 'napi:*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Zig
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - 'aarch64-apple-darwin'
          - 'x86_64-apple-darwin'
          - 'x86_64-unknown-linux-musl'
          - 'aarch64-unknown-linux-musl'
          - 'x86_64-unknown-linux-gnu'
          - 'aarch64-unknown-linux-gnu'
          - 'x86_64-pc-windows-msvc'
          - 'aarch64-pc-windows-msvc'

    steps:
      - run: docker run --rm --privileged multiarch/qemu-user-static:register --reset
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # ── Cargo registry / git cache (hash-based, auto-invalidates) ──
      - name: Cache cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Install ziglang
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild and cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-xwin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ── macOS SDK (cached) ──
      - name: Cache macOS SDK
        if: contains(matrix.target, 'apple')
        uses: actions/cache@v4
        with:
          path: /opt/MacOSX11.3.sdk
          key: macos-sdk-11.3

      - name: Install macOS SDK
        if: contains(matrix.target, 'apple')
        run: |
          if [ ! -d /opt/MacOSX11.3.sdk ]; then
            sudo mkdir -p /opt
            curl -L "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" | sudo tar -J -x -C /opt
          fi
          ls -la /opt/MacOSX11.3.sdk

      # ── Windows MSVC tools ──
      - name: Install Windows MSVC tools
        if: contains(matrix.target, 'windows')
        run: |
          sudo apt update
          sudo apt install -y lld llvm

      # ── Cross build ──
      - name: Cross build native addon
        env:
          SDKROOT: /opt/MacOSX11.3.sdk
        run: |
          pnpm exec napi build --manifest-path bindings/node/Cargo.toml --target ${{ matrix.target }} --platform --release --cross-compile

      # ── Copy native binding to repo root (napi outputs to bindings/node/) ──
      - name: Copy native binding to root
        run: |
          cp bindings/node/*.node . 2>/dev/null || echo "No .node file in bindings/node"
          ls -la *.node

      - name: List and verify generated files
        run: |
          echo "Built files for target: ${{ matrix.target }}"
          ls -la *.node || echo "No .node files found"
          ls -la index.* || echo "No index files found"
          echo "File details:"
          find . -name "*.node" -exec file {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.node
            index.js
            index.d.ts
          retention-days: 30

  test:
    name: Test Zig Cross Compiled ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker-platform: arm64
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker-platform: arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.settings.target }}
          path: ./

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: List files
        shell: bash
        run: |
          echo "Downloaded artifacts for target: ${{ matrix.settings.target }}"
          ls -la *.node || echo "No .node files found"
          ls -la index.* || echo "No index files found"
          echo "Checking file contents..."
          find . -name "*.node" -exec file {} \;

      - name: List Linux x64 files only
        run: |
          echo "Built Linux target: ${{ matrix.settings.target }}"
          echo "Current environment:"
          uname -a
          ldd --version | head -1
          echo "Available .node files:"
          ls -la *.node || echo "No .node files found"
          echo "Node.js version:"
          node --version
          echo "Skipping tests, only listing files..."
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu' || matrix.settings.target == 'x86_64-unknown-linux-musl'

      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: matrix.settings.docker-platform != null

      - name: List ARM64 files with Docker
        uses: addnab/docker-run-action@v3
        if: matrix.settings.docker-platform != null
        with:
          image: node:22-alpine
          options: --platform linux/${{ matrix.settings.docker-platform }} -v ${{ github.workspace }}:/build -w /build
          run: |
            echo "Built target: ${{ matrix.settings.target }} on platform: ${{ matrix.settings.docker-platform }}"
            ls -la *.node || echo "No .node files found in workspace"
            apk add --no-cache file
            echo "Files after checking workspace:"
            ls -la *.node || echo "No .node files found"
            find . -name "*.node" -exec file {} \; || echo "No .node files to analyze"
            echo "Skipping tests, only listing files..."

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - test
    if: ${{ needs.test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: create npm dirs
        run: pnpm exec napi create-npm-dirs

      - name: Move artifacts and create npm packages
        run: |
          echo "=== Moving artifacts ==="
          for dir in artifacts/*/; do
            echo "  -> copying from $dir"
            cp "$dir"*.node . 2>/dev/null || true
          done
          echo "=== Files in root ==="
          ls -la *.node || echo "No .node files"
          pnpm artifacts
          echo "=== npm dirs ==="
          ls -R ./npm

      - name: Verify npm authentication
        run: |
          echo "Verifying npm authentication..."
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          echo "Publishing main package..."
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
